name: Main Checks

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha args to scope the node tests (e.g. --grep rsa)'
        required: false
        default: ''

permissions: {}

jobs:
  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [6.x, 8.x, 10.x, 12.x, 14.x, 16.x, 18.x, 20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    # FIXME: Install/build with 16.x until webpack is updated
    - name: Use Node.js 16.x
      uses: actions/setup-node@v6
      with:
        node-version: 16.x
    - name: Pin npm registry to release-date time machine
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-03-24T21:44:34.668000Z
    - run: npm install
    # FIXME: Run tests with target version until webpack is updated
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - name: Run test with Node.js ${{ matrix.node-version }}
      run: npm run test-node -- ${{ inputs.test-filter }}
  test-karma:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [16.x]
        bundler: [webpack, browserify]
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - name: Pin npm registry to release-date time machine
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-03-24T21:44:34.668000Z
    - run: npm install
    - name: Run karma tests
      run: |
        if [ -z "${{ inputs.test-filter }}" ]; then
          npm run test-karma
        fi
      env:
        BUNDLER: ${{ matrix.bundler }}
