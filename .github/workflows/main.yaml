#    runs-on: ubuntu-latest
#    timeout-minutes: 10
#    strategy:
#      matrix:
#        node-version: [16.x]
#    steps:
#    - uses: actions/checkout@v5
#      with:
#        persist-credentials: false
#    - name: Use Node.js ${{ matrix.node-version }}
#      uses: actions/setup-node@v6
#      with:
#        node-version: ${{ matrix.node-version }}
#    - run: npm install
#    - name: Run eslint
#      run: npm run lint
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    # Install/build with 16.x like upstream's own jobs (webpack 4)
    - name: Use Node.js 16.x
      uses: actions/setup-node@v6
      with:
        node-version: 16.x
    - name: Pin npm registry to release-date time machine
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-03-24T21:44:34.668000Z
    - run: npm install
    - run: npm run build
    - name: Use Node.js 22.x for packing
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
    - run: npm i -g npm@11.7.0
    - run: npm pack
    - uses: actions/upload-artifact@v4
      with:
        name: node-forge-tgz
        path: node-forge-1.4.0.tgz
        if-no-files-found: error
